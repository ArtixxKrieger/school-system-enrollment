openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Kurios Enrollment System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: dashboard
    description: Dashboard statistics
  - name: students
    description: Student management
  - name: enrollees
    description: Enrollee management
  - name: courses
    description: Course management
  - name: curriculum
    description: Curriculum management
  - name: roles
    description: Role management
  - name: users
    description: User management
  - name: settings
    description: Enrollment settings
  - name: activity
    description: Activity logs
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List students
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: course_id
          in: query
          schema: { type: string }
        - name: year_level
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: semester
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentListResponse"

  /students/{id}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get student by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Student details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
    patch:
      operationId: updateStudent
      tags: [students]
      summary: Update student
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdate"
      responses:
        "200":
          description: Student updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /students/{id}/status:
    patch:
      operationId: updateStudentStatus
      tags: [students]
      summary: Update student status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentStatusUpdate"
      responses:
        "200":
          description: Status updated

  /students/stats:
    get:
      operationId: getStudentStats
      tags: [students]
      summary: Get student statistics
      responses:
        "200":
          description: Student stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentStats"

  /enrollees:
    get:
      operationId: listEnrollees
      tags: [enrollees]
      summary: List enrollees
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: course
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: enrollment_type
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: List of enrollees
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrolleeListResponse"
    post:
      operationId: createEnrollee
      tags: [enrollees]
      summary: Create enrollee (pre-registration)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolleeInput"
      responses:
        "201":
          description: Enrollee created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollee"

  /enrollees/stats:
    get:
      operationId: getEnrolleeStats
      tags: [enrollees]
      summary: Get enrollee statistics
      responses:
        "200":
          description: Enrollee stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrolleeStats"

  /enrollees/{id}/approve:
    post:
      operationId: approveEnrollee
      tags: [enrollees]
      summary: Approve an enrollee
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveEnrolleeInput"
      responses:
        "200":
          description: Enrollee approved

  /enrollees/{id}/reject:
    post:
      operationId: rejectEnrollee
      tags: [enrollees]
      summary: Reject an enrollee
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectEnrolleeInput"
      responses:
        "200":
          description: Enrollee rejected

  /enrollees/bulk-approve:
    post:
      operationId: bulkApproveEnrollees
      tags: [enrollees]
      summary: Bulk approve enrollees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkApproveInput"
      responses:
        "200":
          description: Enrollees approved

  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List courses
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
    post:
      operationId: createCourse
      tags: [courses]
      summary: Create course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Course created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /courses/{id}:
    patch:
      operationId: updateCourse
      tags: [courses]
      summary: Update course
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseUpdate"
      responses:
        "200":
          description: Course updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
    delete:
      operationId: deleteCourse
      tags: [courses]
      summary: Delete course
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Course deleted

  /curriculum:
    get:
      operationId: listCurriculum
      tags: [curriculum]
      summary: List curriculum subjects
      parameters:
        - name: course_id
          in: query
          schema: { type: string }
        - name: year_level
          in: query
          schema: { type: string }
        - name: semester
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of curriculum subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CurriculumSubject"
    post:
      operationId: createCurriculumSubject
      tags: [curriculum]
      summary: Create curriculum subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurriculumInput"
      responses:
        "201":
          description: Subject created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurriculumSubject"

  /curriculum/{id}:
    patch:
      operationId: updateCurriculumSubject
      tags: [curriculum]
      summary: Update curriculum subject
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurriculumUpdate"
      responses:
        "200":
          description: Subject updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurriculumSubject"
    delete:
      operationId: deleteCurriculumSubject
      tags: [curriculum]
      summary: Delete curriculum subject
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Subject deleted

  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: List roles
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      operationId: createRole
      tags: [roles]
      summary: Create role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"

  /roles/{id}:
    patch:
      operationId: updateRole
      tags: [roles]
      summary: Update role permissions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
    delete:
      operationId: deleteRole
      tags: [roles]
      summary: Delete role
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Role deleted

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get enrollment settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update enrollment settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentSettings"

  /activity-logs:
    get:
      operationId: listActivityLogs
      tags: [activity]
      summary: List activity logs
      parameters:
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Activity logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityLogListResponse"

  /vouchers:
    get:
      operationId: listVouchers
      tags: [vouchers]
      summary: List all vouchers (admin only)
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: List of vouchers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Voucher"
    post:
      operationId: generateVouchers
      tags: [vouchers]
      summary: Generate voucher codes (admin only)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateVouchersInput"
      responses:
        "201":
          description: Generated vouchers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Voucher"

  /vouchers/validate:
    post:
      operationId: validateVoucher
      tags: [vouchers]
      summary: Validate a voucher code (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateVoucherInput"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoucherValidationResult"

  /vouchers/{id}:
    delete:
      operationId: deleteVoucher
      tags: [vouchers]
      summary: Delete/revoke a voucher (admin only)
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted

  /profile:
    get:
      operationId: getProfile
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    LoginInput:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
        password:
          type: string

    AuthResult:
      type: object
      properties:
        ok:
          type: boolean
        user:
          $ref: "#/components/schemas/CurrentUser"
      required: [ok]

    CurrentUser:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        email:
          type: string
        role:
          type: string
        fullName:
          type: string
        photo:
          type: ["string", "null"]
        yearLevel:
          type: ["integer", "null"]
        currentSemester:
          type: ["integer", "null"]
        courseCode:
          type: ["string", "null"]
        permissions:
          type: object
      required: [id, userId, email, role, fullName]

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string

    DashboardStats:
      type: object
      properties:
        totalStudents:
          type: integer
        activeCourses:
          type: integer
        pendingEnrollees:
          type: integer
        totalEnrolled:
          type: integer
        preRegistered:
          type: integer
        approved:
          type: integer
        registered:
          type: integer
        nearCapacity:
          type: integer
        remainingCapacity:
          type: integer
        activePrograms:
          type: integer
        programBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/BreakdownItem"
        yearLevelBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/BreakdownItem"
        curriculumStats:
          type: object
          properties:
            subjects:
              type: integer
            programs:
              type: integer
            blocks:
              type: integer
            firstSemCount:
              type: integer
            secondSemCount:
              type: integer
      required: [totalStudents, activeCourses, pendingEnrollees, totalEnrolled]

    BreakdownItem:
      type: object
      properties:
        label:
          type: string
        meta:
          type: string
        value:
          type: integer
      required: [label, value]

    Student:
      type: object
      properties:
        id:
          type: integer
        studentId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: ["string", "null"]
        email:
          type: string
        phone:
          type: ["string", "null"]
        guardianContact:
          type: ["string", "null"]
        fbName:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        birthDate:
          type: ["string", "null"]
        gender:
          type: ["string", "null"]
        courseId:
          type: integer
        courseCode:
          type: string
        courseName:
          type: string
        yearLevel:
          type: integer
        currentSemester:
          type: integer
        currentAcademicYear:
          type: ["string", "null"]
        financeStatus:
          type: string
        studentType:
          type: string
        status:
          type: string
        gpa:
          type: ["number", "null"]
        flagGroup:
          type: ["string", "null"]
        isAccountActive:
          type: boolean
        enrollmentDate:
          type: string
        profilePhoto:
          type: ["string", "null"]
      required: [id, studentId, firstName, lastName, email, courseId, courseCode, courseName, yearLevel, currentSemester, status, isAccountActive]

    StudentListResponse:
      type: object
      properties:
        students:
          type: array
          items:
            $ref: "#/components/schemas/Student"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
      required: [students, total, page, totalPages]

    StudentUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        email:
          type: string
        phone:
          type: string
        guardianContact:
          type: string
        fbName:
          type: string
        address:
          type: string
        birthDate:
          type: string
        gender:
          type: string
        yearLevel:
          type: integer
        currentSemester:
          type: integer
        currentAcademicYear:
          type: string
        financeStatus:
          type: string
        studentType:
          type: string
        flagGroup:
          type: string
        gpa:
          type: number
        profilePhoto:
          type: string

    StudentStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
        isAccountActive:
          type: boolean

    StudentStats:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        inactive:
          type: integer
        graduated:
          type: integer
        transferred:
          type: integer
      required: [total, active, inactive, graduated, transferred]

    Enrollee:
      type: object
      properties:
        id:
          type: integer
        preRegNumber:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: ["string", "null"]
        email:
          type: string
        phone:
          type: ["string", "null"]
        guardianContact:
          type: ["string", "null"]
        fbName:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        birthDate:
          type: ["string", "null"]
        gender:
          type: ["string", "null"]
        courseId:
          type: ["integer", "null"]
        courseCode:
          type: ["string", "null"]
        courseName:
          type: ["string", "null"]
        yearLevel:
          type: integer
        status:
          type: string
        enrollmentType:
          type: string
        applicationDate:
          type: string
        approvedDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
      required: [id, preRegNumber, firstName, lastName, email, yearLevel, status, enrollmentType, applicationDate]

    EnrolleeListResponse:
      type: object
      properties:
        enrollees:
          type: array
          items:
            $ref: "#/components/schemas/Enrollee"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
      required: [enrollees, total, page, totalPages]

    EnrolleeInput:
      type: object
      required: [firstName, lastName, email, courseId, yearLevel, voucherCode]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        email:
          type: string
        phone:
          type: string
        guardianContact:
          type: string
        fbName:
          type: string
        address:
          type: string
        birthDate:
          type: string
        gender:
          type: string
        courseId:
          type: integer
        yearLevel:
          type: integer
        enrollmentType:
          type: string
        password:
          type: string
        voucherCode:
          type: string

    Voucher:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        isUsed:
          type: boolean
        usedBy:
          type: ["integer", "null"]
        createdBy:
          type: ["integer", "null"]
        createdByName:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        expiresAt:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, code, isUsed, createdAt]

    GenerateVouchersInput:
      type: object
      properties:
        count:
          type: integer
        notes:
          type: string
        expiresAt:
          type: string

    ValidateVoucherInput:
      type: object
      required: [code]
      properties:
        code:
          type: string

    VoucherValidationResult:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        voucherId:
          type: integer
        error:
          type: string

    EnrolleeStats:
      type: object
      properties:
        preRegistered:
          type: integer
